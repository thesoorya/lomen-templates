<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login / Register - LoMen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d40a5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden antialiased" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="w-full max-w-6xl p-4 sm:p-6 lg:p-8">
<div class="mb-10 text-center">
<a class="text-4xl font-bold tracking-tighter text-[#1A1A1A] dark:text-white" href="#">LoMen</a>
</div>
<div class="grid w-full grid-cols-1 gap-12 lg:grid-cols-2 lg:gap-0">
<!-- Login Section -->
<div class="flex flex-col justify-center px-4 sm:px-10 lg:pr-16">
<div class="w-full max-w-md mx-auto">
<h2 class="text-[#0d121b] dark:text-gray-100 tracking-light text-[28px] font-bold leading-tight pb-6 text-left">Welcome Back</h2>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="flex flex-col">
<p class="text-[#0d121b] dark:text-gray-200 text-base font-medium leading-normal pb-2">Email Address</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white dark:bg-[#1A1A1A] dark:border-gray-700 dark:focus:border-primary focus:outline-0 focus:ring-0 border border-[#cfd7e7] bg-white focus:border-primary h-14 placeholder:text-[#888888] p-[15px] pr-2 text-base font-normal leading-normal" placeholder="Enter your email" type="email" value=""/>
</div>
</label>
</div>
<div>
<label class="flex flex-col">
<p class="text-[#0d121b] dark:text-gray-200 text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white dark:bg-[#1A1A1A] dark:border-gray-700 dark:focus:border-primary focus:outline-0 focus:ring-0 border border-[#cfd7e7] bg-white focus:border-primary h-14 placeholder:text-[#888888] p-[15px] pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
</div>
</label>
</div>
<div class="flex items-center justify-between">
<div>
<label class="flex items-center gap-x-3 py-3 flex-row">
<input class="h-5 w-5 rounded border-[#cfd7e7] dark:bg-transparent dark:border-gray-600 border-2 bg-transparent text-[#1A1A1A] checked:bg-[#1A1A1A] checked:border-[#1A1A1A] focus:ring-0 focus:ring-offset-0 focus:border-[#cfd7e7] dark:focus:border-primary focus:outline-none" type="checkbox"/>
<p class="text-[#0d121b] dark:text-gray-300 text-sm font-normal leading-normal">Remember me</p>
</label>
</div>
<p class="text-[#4c669a] dark:text-gray-400 text-sm font-normal leading-normal underline hover:text-[#1A1A1A] dark:hover:text-white transition-colors"><a href="#">Forgot password?</a></p>
</div>
<div>
<button class="flex w-full items-center justify-center rounded-lg bg-[#1A1A1A] px-6 py-4 text-center text-base font-semibold text-white shadow-sm transition-all hover:bg-[#333333] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1A1A1A]" type="submit">Login</button>
</div>
</form>
<p class="mt-8 text-center text-sm text-[#4c669a] dark:text-gray-400">New customer? <a class="font-semibold text-[#1A1A1A] dark:text-white hover:underline" href="#">Create account</a></p>
</div>
</div>
<!-- Separator -->
<div class="hidden lg:block">
<div class="h-full w-px bg-[#E0E0E0] dark:bg-gray-800 mx-auto"></div>
</div>
<!-- Registration Section -->
<div class="flex flex-col justify-center px-4 sm:px-10 lg:pl-16">
<div class="w-full max-w-md mx-auto">
<h2 class="text-[#0d121b] dark:text-gray-100 tracking-light text-[28px] font-bold leading-tight pb-6 text-left">Create Account</h2>
<form action="#" class="space-y-6" method="POST">
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
<div>
<label class="flex flex-col">
<p class="text-[#0d121b] dark:text-gray-200 text-base font-medium leading-normal pb-2">First Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white dark:bg-[#1A1A1A] dark:border-gray-700 dark:focus:border-primary focus:outline-0 focus:ring-0 border border-[#cfd7e7] bg-white focus:border-primary h-14 placeholder:text-[#888888] p-[15px] text-base font-normal leading-normal" placeholder="John" type="text"/>
</label>
</div>
<div>
<label class="flex flex-col">
<p class="text-[#0d121b] dark:text-gray-200 text-base font-medium leading-normal pb-2">Last Name</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white dark:bg-[#1A1A1A] dark:border-gray-700 dark:focus:border-primary focus:outline-0 focus:ring-0 border border-[#cfd7e7] bg-white focus:border-primary h-14 placeholder:text-[#888888] p-[15px] text-base font-normal leading-normal" placeholder="Doe" type="text"/>
</label>
</div>
</div>
<div>
<label class="flex flex-col">
<p class="text-[#0d121b] dark:text-gray-200 text-base font-medium leading-normal pb-2">Email Address</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white dark:bg-[#1A1A1A] dark:border-gray-700 dark:focus:border-primary focus:outline-0 focus:ring-0 border border-[#cfd7e7] bg-white focus:border-primary h-14 placeholder:text-[#888888] p-[15px] text-base font-normal leading-normal" placeholder="john.doe@example.com" type="email"/>
</label>
</div>
<div>
<label class="flex flex-col">
<p class="text-[#0d121b] dark:text-gray-200 text-base font-medium leading-normal pb-2">Password</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d121b] dark:text-white dark:bg-[#1A1A1A] dark:border-gray-700 dark:focus:border-primary focus:outline-0 focus:ring-0 border border-[#cfd7e7] bg-white focus:border-primary h-14 placeholder:text-[#888888] p-[15px] text-base font-normal leading-normal" placeholder="Create a strong password" type="password"/>
</label>
</div>
<div>
<label class="flex items-center gap-x-3 py-3 flex-row">
<input class="h-5 w-5 rounded border-[#cfd7e7] dark:bg-transparent dark:border-gray-600 border-2 bg-transparent text-[#1A1A1A] checked:bg-[#1A1A1A] checked:border-[#1A1A1A] focus:ring-0 focus:ring-offset-0 focus:border-[#cfd7e7] dark:focus:border-primary focus:outline-none" type="checkbox"/>
<p class="text-[#0d121b] dark:text-gray-300 text-sm font-normal leading-normal">I agree to the <a class="underline hover:text-[#1A1A1A] dark:hover:text-white" href="#">Terms &amp; Conditions</a></p>
</label>
</div>
<div>
<button class="flex w-full items-center justify-center rounded-lg bg-[#1A1A1A] px-6 py-4 text-center text-base font-semibold text-white shadow-sm transition-all hover:bg-[#333333] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1A1A1A]" type="submit">Create Account</button>
</div>
</form>
<p class="mt-8 text-center text-sm text-[#4c669a] dark:text-gray-400">Already have an account? <a class="font-semibold text-[#1A1A1A] dark:text-white hover:underline" href="#">Login</a></p>
</div>
</div>
</div>
</div>
</div>
</body></html>
